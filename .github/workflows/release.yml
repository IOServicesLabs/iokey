name: Release

# Tag a commit to cut a release:
#     git tag v1.0.0 && git push origin v1.0.0
#
# Produces a signed APK and attaches it to a GitHub Release. This workflow
# REFUSES to publish a debug-signed APK: a release that cannot update an
# existing install is worse than no release at all, because people install it
# and only find out later.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # needed to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Require a signing key
        env:
          KEYSTORE_B64: ${{ secrets.IOKEY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::IOKEY_KEYSTORE_B64 is not set. A release must be signed with the release key, or it cannot update any existing install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "IOKEY_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Check the tag matches versionName
        # A tag that disagrees with the manifest produces a release nobody can
        # reason about later. Catch it before anything is published.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          have=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$want  build.gradle.kts=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $tag does not match versionName $have in app/build.gradle.kts"
            exit 1
          fi

      - name: Build signed release
        env:
          IOKEY_STORE_PASSWORD: ${{ secrets.IOKEY_STORE_PASSWORD }}
          IOKEY_KEY_ALIAS: ${{ secrets.IOKEY_KEY_ALIAS }}
          IOKEY_KEY_PASSWORD: ${{ secrets.IOKEY_KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease --no-daemon --stacktrace

      - name: Name the artifact after the version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # GitHub Releases carry the full build. The Play build is
          # uploaded to the Play Console, not published here.
          cp app/build/outputs/apk/full/release/app-full-release.apk "IOKey-${tag}.apk"
          sha256sum "IOKey-${tag}.apk" > "IOKey-${tag}.apk.sha256"
          cat "IOKey-${tag}.apk.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            IOKey-*.apk
            IOKey-*.apk.sha256
          generate_release_notes: true
          body: |
            Sideload build of IOKey.

            Verify the download before installing:

            ```
            sha256sum -c IOKey-*.apk.sha256
            ```

            Installing over an existing IOKey keeps your settings and
            learned dictionary. Uninstalling erases them — export a backup
            first from **Settings → Privacy → Data and network controls**.
