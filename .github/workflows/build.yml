name: Build

# MANUAL ONLY. This used to run on every push and pull request, which on a
# private repository bills real Actions minutes: a full run builds two
# flavours of an app that vendors llama.cpp and takes ~10 minutes, so a busy
# day of commits could consume an hour of quota on builds nobody read.
#
# Release tags are covered by release.yml, which is the run that actually
# matters. This one is here for when you deliberately want a CI build —
# Actions tab → Build → "Run workflow" — or from the CLI:
#
#     gh workflow run build.yml
#
# Restore `push:`/`pull_request:` here if the quota stops being the binding
# constraint; nothing else about the workflow assumes manual invocation.
on:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run pointless.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        # Shallow by default. This repository vendors llama.cpp (~160 MB), so
        # fetching full history on every run would be a slow, pointless cost.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore release signing key
        # Only when the secrets are visible — i.e. pushes to this repo, not
        # pull requests from forks. Without this the build still succeeds and
        # produces a debug-signed APK.
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.IOKEY_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "IOKEY_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build both distributions
        env:
          IOKEY_STORE_PASSWORD: ${{ secrets.IOKEY_STORE_PASSWORD }}
          IOKEY_KEY_ALIAS: ${{ secrets.IOKEY_KEY_ALIAS }}
          IOKEY_KEY_PASSWORD: ${{ secrets.IOKEY_KEY_PASSWORD }}
        # full = complete app (sideload)
        # play = Play Store build, without READ_SMS and the AccessibilityService
        run: ./gradlew assembleFullRelease assemblePlayRelease --no-daemon --stacktrace

      - name: Verify the Play build declares nothing it should not
        # The whole point of the flavour split. If either of these ever
        # appears in the Play manifest, the build must fail rather than reach
        # a reviewer.
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          apk=app/build/outputs/apk/play/release/app-play-release.apk
          if "$aapt2" dump permissions "$apk" | grep -q "READ_SMS"; then
            echo "::error::Play build declares READ_SMS — a restricted permission it cannot ship with."
            exit 1
          fi
          if "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml | grep -qi "ScreenContextService"; then
            echo "::error::Play build declares the AccessibilityService — policy violation."
            exit 1
          fi
          echo "Play manifest is clean."

      - name: Report what was produced
        # Says out loud which key signed it, so a debug-signed artifact is
        # never mistaken for something that can update a real install.
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/*/*/*.apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "- \`$apk\` ($size)" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "${{ secrets.IOKEY_KEYSTORE_B64 }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release APK signed with the release key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No signing secret available — the release APK is **debug-signed** and cannot update an existing install." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: iokey-apks-${{ github.sha }}
          path: app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error
          retention-days: 30
